<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0c101c" />
  <rect width="94" height="94" x="3" y="3" rx="19" fill="none" stroke="url(#cyber-grad)" stroke-width="2.5" />
  <!-- Hexagonal / AI circuit nodes -->
  <circle cx="50" cy="22" r="3.5" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="26" cy="68" r="3.5" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="74" cy="68" r="3.5" fill="#10b981" filter="url(#glow)" />
  <line x1="50" y1="22" x2="26" y2="68" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="2 2" />
  <line x1="50" y1="22" x2="74" y2="68" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="2 2" />
  <line x1="26" y1="68" x2="74" y2="68" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5" />
  <!-- Monogram text UK -->
  <text x="50" y="58" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">UK</text>
</svg>
